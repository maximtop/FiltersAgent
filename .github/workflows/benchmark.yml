# Runs a benchmark series: every selected golden case in its own job, in parallel, then one summary
# over their records. On a laptop the same series runs one case after another and stalls when the
# machine sleeps or runs out of disk; here it takes as long as its slowest case.
#
# Dispatch it from the default branch. `ref` names the branch, tag or commit whose code and cases
# run, so a branch cut before this workflow existed runs too, as long as it has the series options
# of `pnpm test:e2e` (`--output-root`, `--knowledge-base-sha`); the v1.x tags do not. The plan job
# pins `ref` to one commit and one KnowledgeBase commit, and every case job runs exactly those: a
# series never mixes agent revisions. In a public repository the logs and the artifacts are public:
# they hold the agent's reports and screenshots of the case sites.
#
# `provider` picks the model endpoint: `anthropic` is the Anthropic Messages API with the
# BENCHMARK_ANTHROPIC_KEY secret; `gateway` is an OpenAI-compatible endpoint whose URL and key come
# only from the BENCHMARK_GATEWAY_URL and BENCHMARK_GATEWAY_KEY secrets. The gateway URL must never
# be published, its host included: every job masks both first, the case log passes the diagnostics
# redactor, and every artifact is redacted and checked for the host before it is uploaded.
#
# A case job fails when `pnpm test:e2e` exits 3 (the case ended as `infrastructure_failure` or
# `site_unreachable`) or when the command failed before it wrote a record. Re-run case jobs one by
# one, not with "Re-run failed jobs": a record that says `provider_rejected` or `intake_skipped` is
# a failure counted against the model, and a re-run overwrites it. Re-run a job whose record says
# `transient` or `site_unreachable`, or that wrote no record, and then the summary job. Nothing
# retries on its own: every repeat is paid for.
name: Benchmark series

run-name: Benchmark ${{ inputs.model }} on ${{ inputs.ref }}

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag or commit whose code and cases run; v1.x tags cannot run
                type: string
                default: master
            provider:
                description: Model endpoint
                type: choice
                options:
                    - anthropic
                    - gateway
                default: anthropic
            model:
                description: Model id; it must be in BENCHMARK_PRICING below
                type: string
                default: claude-sonnet-5-5
            vision-model:
                description: Vision model id, empty for the model itself; it must be priced too
                type: string
                default: ''
            # Nothing checks the limits against the models: a value above a model's own limit fails
            # every request with HTTP 400, in every case job.
            context-window-tokens:
                description: LLM_CONTEXT_WINDOW_TOKENS; must match the model's context window
                type: number
                default: 1000000
            max-output-tokens:
                description: LLM_MAX_OUTPUT_TOKENS; must match the model's full completion limit
                type: number
                default: 128000
            vision-max-output-tokens:
                description: LLM_VISION_MAX_OUTPUT_TOKENS; required when the vision model differs
                type: string
                default: ''
            cases:
                description: Case directory names separated by spaces, or all
                type: string
                default: all
            knowledge-base-sha:
                description: Full KnowledgeBase commit; empty pins its current master
                type: string
                default: ''
            # Only uncached and cache-write input tokens count toward the input rate limit. One
            # Sonnet case spends 33,000-116,000 of them per minute of its run, median 53,000
            # (sonnet-5.5 series r4), so five cases peak under 600,000 a minute; size it to the
            # key's tier. A 429 that outlasts the request retries ends the case as an infrastructure
            # failure after it was paid for. 20 cases take about 41 minutes at 5 and about 24 at 10.
            max-parallel:
                description: Cases running at the same time; keep within the key's rate limit
                type: number
                default: 5

permissions:
    contents: read

defaults:
    run:
        # An explicit `bash` adds `-o pipefail`, so a case that fails under `| tee` fails its step.
        shell: bash

env:
    # `cloakbrowser install` downloads the build the locked package pins, then starts an update
    # check that can fetch a newer one; jobs of one series start minutes apart and must all run the
    # same browser build. The benchmark CLI defaults it to false too, but the install step runs
    # before it.
    CLOAKBROWSER_AUTO_UPDATE: 'false'
    # USD per million tokens for LLM_PRICING_FILE (docs/guides/benchmark.md#count-the-cost). It
    # lives here rather than in the tree so that any `ref` is priced the same. A model missing from
    # it stops the series in the plan job: a series without costs cannot be compared.
    BENCHMARK_PRICING: |
        {
            "source": "Claude models: Anthropic list prices, checked 2026-10-19; cache writes at the 5-minute rate (1.25x input). claude-haiku-5-5 is priced for prompts up to 100,000 tokens and costs 5x above that, which this table cannot express, so its cost is a lower bound. deepseek-flash and gemini-3.7-flash: models.dev catalog rates of 2026-10-14.",
            "models": {
                "claude-fable-5-1": {
                    "inputUsdPerMillionTokens": 10,
                    "outputUsdPerMillionTokens": 50,
                    "cachedInputUsdPerMillionTokens": 0.25,
                    "cacheWriteUsdPerMillionTokens": 12.5
                },
                "claude-opus-5-5": {
                    "inputUsdPerMillionTokens": 4,
                    "outputUsdPerMillionTokens": 20,
                    "cachedInputUsdPerMillionTokens": 0.2,
                    "cacheWriteUsdPerMillionTokens": 5
                },
                "claude-sonnet-5-5": {
                    "inputUsdPerMillionTokens": 2,
                    "outputUsdPerMillionTokens": 10,
                    "cachedInputUsdPerMillionTokens": 0.2,
                    "cacheWriteUsdPerMillionTokens": 2.5
                },
                "claude-haiku-5-5": {
                    "inputUsdPerMillionTokens": 0.1,
                    "outputUsdPerMillionTokens": 0.5,
                    "cachedInputUsdPerMillionTokens": 0.01,
                    "cacheWriteUsdPerMillionTokens": 0.125
                },
                "deepseek-flash": {
                    "inputUsdPerMillionTokens": 0.15,
                    "outputUsdPerMillionTokens": 0.6,
                    "cachedInputUsdPerMillionTokens": 0.02,
                    "cacheWriteUsdPerMillionTokens": 0.15
                },
                "gemini-3.7-flash": {
                    "inputUsdPerMillionTokens": 0.75,
                    "outputUsdPerMillionTokens": 3.75,
                    "cachedInputUsdPerMillionTokens": 0.075,
                    "cacheWriteUsdPerMillionTokens": 0.79167
                }
            }
        }

jobs:
    # Checks the provider's secrets, the models' prices, the case names and the KnowledgeBase commit
    # before any case job starts, so a mistake in them costs one short job and no model call. The
    # token limits are not checked here.
    plan:
        name: Plan the series
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            commit: ${{ steps.commit.outputs.commit }}
            cases: ${{ steps.cases.outputs.cases }}
            knowledge-base-sha: ${{ steps.knowledge-base.outputs.sha }}
        steps:
            # Masks are per job, so every job starts with this step. GitHub masks the secret itself,
            # but an error such as a DNS failure names the host alone. The host is also kept for the
            # artifact check below.
            - &mask-gateway
              name: Mask the gateway endpoint
              env:
                  GATEWAY_URL: ${{ secrets.BENCHMARK_GATEWAY_URL }}
              run: |
                  if [ -z "$GATEWAY_URL" ]; then
                      exit 0
                  fi
                  host="${GATEWAY_URL#*://}"
                  host="${host%%/*}"
                  host="${host##*@}"
                  host="${host%%:*}"
                  if [ -z "$host" ]; then
                      echo "::error::Secret BENCHMARK_GATEWAY_URL has no host."
                      exit 1
                  fi
                  echo "::add-mask::$GATEWAY_URL"
                  echo "::add-mask::$host"
                  printf '%s' "$host" > "$RUNNER_TEMP/gateway-host"

            - name: Check the provider and the prices
              env:
                  PROVIDER: ${{ inputs.provider }}
                  ANTHROPIC_KEY: ${{ secrets.BENCHMARK_ANTHROPIC_KEY }}
                  GATEWAY_URL: ${{ secrets.BENCHMARK_GATEWAY_URL }}
                  GATEWAY_KEY: ${{ secrets.BENCHMARK_GATEWAY_KEY }}
                  MODEL: ${{ inputs.model }}
                  VISION_MODEL: ${{ inputs.vision-model }}
                  VISION_MAX_OUTPUT_TOKENS: ${{ inputs.vision-max-output-tokens }}
              run: |
                  missing=()
                  case "$PROVIDER" in
                      anthropic)
                          [ -n "$ANTHROPIC_KEY" ] || missing+=(BENCHMARK_ANTHROPIC_KEY)
                          ;;
                      gateway)
                          [ -n "$GATEWAY_URL" ] || missing+=(BENCHMARK_GATEWAY_URL)
                          [ -n "$GATEWAY_KEY" ] || missing+=(BENCHMARK_GATEWAY_KEY)
                          ;;
                  esac
                  if [ ${#missing[@]} -gt 0 ]; then
                      echo "::error::Provider $PROVIDER needs secrets this repository lacks: ${missing[*]}."
                      exit 1
                  fi
                  for model in "$MODEL" ${VISION_MODEL:+"$VISION_MODEL"}; do
                      if ! jq -e --arg model "$model" '.models | has($model)' <<<"$BENCHMARK_PRICING" >/dev/null; then
                          echo "::error::Model $model has no price in BENCHMARK_PRICING."
                          exit 1
                      fi
                  done
                  if [ -n "$VISION_MODEL" ] && [ "$VISION_MODEL" != "$MODEL" ] && [ -z "$VISION_MAX_OUTPUT_TOKENS" ]; then
                      echo "::error::vision-max-output-tokens is required when vision-model differs from model."
                      exit 1
                  fi

            - name: Check out the benchmarked ref
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false

            - name: Pin the commit
              id: commit
              run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Select the cases
              id: cases
              env:
                  CASES: ${{ inputs.cases }}
                  REF: ${{ inputs.ref }}
              run: |
                  available="$(find lab/benchmark/e2e/cases -mindepth 2 -maxdepth 2 -name run.json \
                      | awk -F/ '{ print $(NF-1) }' | sort)"
                  if [ "$CASES" = all ]; then
                      selected="$available"
                  else
                      selected="$(tr -s ' ' '\n' <<<"$CASES" | sed '/^$/d' | sort -u)"
                      unknown="$(comm -23 <(echo "$selected") <(echo "$available"))"
                      if [ -n "$unknown" ]; then
                          echo "::error::No such cases at $REF: $(tr '\n' ' ' <<<"$unknown")"
                          exit 1
                      fi
                  fi
                  if [ -z "$selected" ]; then
                      echo "::error::No cases selected at $REF."
                      exit 1
                  fi
                  echo "cases=$(jq -Rnc '[inputs]' <<<"$selected")" >> "$GITHUB_OUTPUT"
                  echo "Selected $(wc -l <<<"$selected") cases"

            # Left to itself, each case job would resolve KnowledgeBase master on its own and could
            # land on a different commit; one series reads one KnowledgeBase revision.
            - name: Pin the KnowledgeBase commit
              id: knowledge-base
              env:
                  KNOWLEDGE_BASE_SHA: ${{ inputs.knowledge-base-sha }}
              run: |
                  sha="$(tr '[:upper:]' '[:lower:]' <<<"$KNOWLEDGE_BASE_SHA")"
                  if [ -z "$sha" ]; then
                      sha="$(git ls-remote https://github.com/AdguardTeam/KnowledgeBase.git refs/heads/master | cut -f1)"
                  fi
                  if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::KnowledgeBase commit must be a full 40-character sha, got '$sha'."
                      exit 1
                  fi
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "KnowledgeBase: $sha"

    case:
        name: ${{ matrix.case }}
        needs: plan
        runs-on: ubuntu-latest
        # The agent's own budget is 60 minutes (AGENT_INVESTIGATION_BUDGET_MS); the rest covers the
        # setup, the case preparation and the evaluation. A job killed at this limit leaves no
        # record, only its log.
        timeout-minutes: 80
        strategy:
            # One case's failure says nothing about the others: every case runs to its own end.
            fail-fast: false
            # `fromJSON` makes the input an integer. Given the input as it is, GitHub creates no
            # job at all, with no error and no annotation.
            max-parallel: ${{ fromJSON(inputs.max-parallel) }}
            matrix:
                case: ${{ fromJSON(needs.plan.outputs.cases) }}
        steps:
            - *mask-gateway

            - name: Check out the pinned commit
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.plan.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  corepack enable
                  corepack prepare pnpm@10 --activate

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The system libraries include the font packages, so CJK and emoji pages render in the
            # screenshots the agent reads.
            - name: Install Chromium system libraries
              run: pnpm exec playwright-core install-deps chromium

            # Downloaded from CloakHQ's release channel on every run and never cached: the binary's
            # licence forbids redistributing it.
            - name: Install the CloakBrowser binary
              run: pnpm exec cloakbrowser install

            # The series stays under the git-ignored tmp/: the record's agent revision reads
            # `git status`, and an untracked file would mark the run dirty. The log becomes a public
            # artifact, so it passes the diagnostics redactor first: GitHub masks secrets in the job
            # log only.
            # The provider's endpoint and key are chosen here and the other secrets are unset, so
            # the run holds only the key it uses. The optional vision variables are exported only
            # when given: an empty LLM_VISION_MAX_OUTPUT_TOKENS reads as 0.
            - name: Run the case
              env:
                  PROVIDER: ${{ inputs.provider }}
                  ANTHROPIC_KEY: ${{ secrets.BENCHMARK_ANTHROPIC_KEY }}
                  GATEWAY_URL: ${{ secrets.BENCHMARK_GATEWAY_URL }}
                  GATEWAY_KEY: ${{ secrets.BENCHMARK_GATEWAY_KEY }}
                  VISION_MODEL: ${{ inputs.vision-model }}
                  VISION_MAX_OUTPUT_TOKENS: ${{ inputs.vision-max-output-tokens }}
                  LLM_MODEL: ${{ inputs.model }}
                  LLM_CONTEXT_WINDOW_TOKENS: ${{ inputs.context-window-tokens }}
                  LLM_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
                  LLM_REQUEST_MAX_ATTEMPTS: 3
                  CASE: ${{ matrix.case }}
                  KNOWLEDGE_BASE_SHA: ${{ needs.plan.outputs.knowledge-base-sha }}
              run: |
                  case "$PROVIDER" in
                      anthropic)
                          export LLM_API=anthropic-messages LLM_BASE_URL=https://api.anthropic.com
                          export LLM_API_KEY="$ANTHROPIC_KEY"
                          ;;
                      gateway)
                          export LLM_API=openai-completions LLM_BASE_URL="$GATEWAY_URL"
                          export LLM_API_KEY="$GATEWAY_KEY"
                          ;;
                  esac
                  unset ANTHROPIC_KEY GATEWAY_URL GATEWAY_KEY
                  if [ -n "$VISION_MODEL" ]; then
                      export LLM_VISION_MODEL="$VISION_MODEL"
                  fi
                  if [ -n "$VISION_MAX_OUTPUT_TOKENS" ]; then
                      export LLM_VISION_MAX_OUTPUT_TOKENS="$VISION_MAX_OUTPUT_TOKENS"
                  fi
                  export LLM_PRICING_FILE="$RUNNER_TEMP/pricing.json"
                  printf '%s' "$BENCHMARK_PRICING" > "$LLM_PRICING_FILE"
                  mkdir -p tmp/series/logs
                  pnpm -s test:e2e -- --case "$CASE" --output-root tmp/series \
                      --knowledge-base-sha "$KNOWLEDGE_BASE_SHA" 2>&1 \
                      | pnpm -s exec tsx lab/benchmark/redact-diagnostics.ts \
                      | tee "tmp/series/logs/$CASE.log"

            # Artifacts are files: GitHub's masking never touches them. Every text file loses the
            # secrets and the gateway host, and any file that still holds one of them, binaries
            # included, blocks every upload of the job. A run file changed here no longer matches
            # its run manifest; that is the price of not publishing the endpoint.
            - &redact-artifacts
              name: Redact the secrets from the artifacts
              id: redact
              if: ${{ always() }}
              env:
                  ANTHROPIC_KEY: ${{ secrets.BENCHMARK_ANTHROPIC_KEY }}
                  GATEWAY_URL: ${{ secrets.BENCHMARK_GATEWAY_URL }}
                  GATEWAY_KEY: ${{ secrets.BENCHMARK_GATEWAY_KEY }}
              run: |
                  if [ ! -d tmp/series ]; then
                      exit 0
                  fi
                  GATEWAY_HOST="$(cat "$RUNNER_TEMP/gateway-host" 2>/dev/null || true)"
                  export GATEWAY_HOST
                  # grep exits 1 when there is no text file at all; only 2 is an error.
                  text_files="$RUNNER_TEMP/redacted-files"
                  listed=0
                  grep -rlI --null '' tmp/series > "$text_files" || listed=$?
                  if [ "$listed" -gt 1 ]; then
                      exit "$listed"
                  fi
                  # The Perl program reads the secrets from %ENV; nothing in it is for the shell.
                  # Its warnings are fatal: a file it cannot rewrite fails the step.
                  # shellcheck disable=SC2016
                  xargs -0 -r perl -pi -e 'BEGIN { $SIG{__WARN__} = sub { die @_ }; @secrets = grep { length } @ENV{qw(GATEWAY_URL GATEWAY_KEY ANTHROPIC_KEY GATEWAY_HOST)} } for my $secret (@secrets) { s/\Q$secret\E/[redacted]/g }' < "$text_files"
                  for name in GATEWAY_URL GATEWAY_KEY ANTHROPIC_KEY GATEWAY_HOST; do
                      if [ -n "${!name}" ] && grep -rqF -- "${!name}" tmp/series; then
                          echo "::error::An artifact still holds $name; nothing is uploaded."
                          exit 1
                      fi
                  done

            # `overwrite` lets a re-run of a case job replace the record of the attempt it repeats.
            - name: Upload the evaluation
              if: ${{ always() && steps.redact.outcome == 'success' }}
              uses: actions/upload-artifact@v7
              with:
                  name: evaluation-${{ matrix.case }}
                  path: tmp/series/evaluations
                  if-no-files-found: warn
                  retention-days: 90
                  overwrite: true

            - name: Upload the run and its log
              if: ${{ always() && steps.redact.outcome == 'success' }}
              uses: actions/upload-artifact@v7
              with:
                  name: run-${{ matrix.case }}
                  path: |
                      tmp/series/runs
                      tmp/series/logs
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 30
                  overwrite: true

    # Runs after failed cases too: a case that ended as an infrastructure failure still wrote its
    # record. Skipped only when the plan failed or the run was cancelled.
    summary:
        name: Summarize the series
        needs: [plan, case]
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - *mask-gateway

            - name: Check out the pinned commit
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.plan.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  corepack enable
                  corepack prepare pnpm@10 --activate

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Download the evaluations
              uses: actions/download-artifact@v8
              with:
                  pattern: evaluation-*
                  merge-multiple: true
                  path: tmp/series/evaluations

            - name: Summarize
              env:
                  CASES: ${{ needs.plan.outputs.cases }}
                  MODEL: ${{ inputs.model }}
                  REF: ${{ inputs.ref }}
                  COMMIT: ${{ needs.plan.outputs.commit }}
                  KNOWLEDGE_BASE_SHA: ${{ needs.plan.outputs.knowledge-base-sha }}
              # The heading and the cases without a record go out first, so they reach the job
              # summary even when no case wrote a record and there is nothing to summarize.
              run: |
                  mkdir -p tmp/series/evaluations
                  missing="$(jq -r '.[]' <<<"$CASES" | while read -r name; do
                      [ -f "tmp/series/evaluations/$name/benchmark-record.json" ] || echo "$name"
                  done)"
                  {
                      echo "### $MODEL on $REF"
                      echo
                      echo "Commit \`$COMMIT\`, KnowledgeBase \`$KNOWLEDGE_BASE_SHA\`."
                      echo
                      if [ -n "$missing" ]; then
                          echo "No record, the job stopped before writing one: $(tr '\n' ' ' <<<"$missing")"
                          echo
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
                  if [ -n "$missing" ]; then
                      echo "::warning::No record for: $(tr '\n' ' ' <<<"$missing")"
                  fi
                  if [ -z "$(find tmp/series/evaluations -name benchmark-record.json)" ]; then
                      echo "::error::No case wrote a record; nothing to summarize."
                      exit 1
                  fi
                  pnpm -s benchmark:summarize -- tmp/series --csv tmp/series/summary.csv \
                      | tee tmp/series/summary.txt
                  # The summary prints Markdown tables followed by plain lines; two trailing spaces keep
                  # each plain line on its own line instead of merging them into one paragraph.
                  sed 's/$/  /' tmp/series/summary.txt >> "$GITHUB_STEP_SUMMARY"

            - *redact-artifacts

            - name: Upload the summary
              if: ${{ always() && steps.redact.outcome == 'success' }}
              uses: actions/upload-artifact@v7
              with:
                  name: summary
                  path: tmp/series
                  if-no-files-found: warn
                  retention-days: 90
                  overwrite: true
